<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Entre em contato</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="curriculo.html">Currículo</a>
        <a href="github.html">GitHub</a>
        <a href="servicos.html">Serviços</a>
        <a href="contato.html">Contato</a>
    </nav>
</header>

<main>

    <section>

        <h2>Solicite um orçamento</h2>

        <form>

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label>Você é:</label>

            <input type="radio" name="tipo" value="pessoa">
            Pessoa física

            <input type="radio" name="tipo" value="empresa">
            Empresa

            <br><br>

            <label for="horario">Melhor horário para contato:</label>

            <select id="horario" name="horario">
                <option value="manha">Manhã</option>
                <option value="tarde">Tarde</option>
                <option value="noite">Noite</option>
            </select>

            <label for="servico">Serviço desejado:</label>

            <select id="servico" name="servico">
                <option value="estatico">Site estático</option>
                <option value="dinamico">Site dinâmico</option>
                <option value="avancado">Projeto avançado</option>
            </select>

            <label for="data">Data desejada:</label>
            <input type="date" id="data" name="data">

            <label>O que você precisa?</label>

            <input type="checkbox" name="necessidade" value="site">
            Site institucional

            <input type="checkbox" name="necessidade" value="loja">
            Loja virtual

            <input type="checkbox" name="necessidade" value="outro">
            Outro

            <label for="descricao">Descrição do projeto:</label>

            <textarea id="descricao" name="descricao" rows="6"></textarea>

            <br>

            <input type="checkbox" required>
            Concordo em fornecer meus dados para contato.

            <br><br>

            <button type="submit">Enviar</button>

        </form>

    </section>

</main>

<footer>
    <p>
        © 2026 -
        <a href="https://github.com/Arthurlacerd" target="_blank">
            github-pessoal
        </a>
    </p>
</footer>

</body>
</html>
